<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap');
.nlp-promo{--navy:#14284B;--navy2:#1F3264;--gold:#C9A030;--gold-lt:#E8CB7A;position:relative;display:block;width:100%;box-sizing:border-box;background:linear-gradient(90deg,#10213F 0%,var(--navy2) 50%,#10213F 100%);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);overflow:hidden;font-family:'Montserrat',system-ui,-apple-system,sans-serif;text-decoration:none!important;cursor:pointer;animation:nlpPromoGlow 2.6s ease-in-out infinite}
.nlp-promo *{box-sizing:border-box;margin:0;padding:0}
.nlp-promo:before{content:"";position:absolute;top:0;left:-40%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(232,203,122,.22),transparent);transform:skewX(-20deg);animation:nlpPromoShine 4.5s ease-in-out infinite;pointer-events:none}
.nlp-promo .in{position:relative;max-width:1100px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.nlp-promo .txt{color:#fff;font-weight:700;font-size:15px;line-height:1.35;text-align:center}
.nlp-promo .txt .g{color:var(--gold-lt)}
.nlp-promo .clock{color:var(--gold-lt);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.nlp-promo .btn{display:inline-block;background:linear-gradient(180deg,var(--gold-lt),var(--gold));color:#0F1F3D!important;font-weight:800;font-size:15px;line-height:1;padding:13px 24px;border-radius:999px;white-space:nowrap;animation:nlpPromoBtn 2.6s ease-in-out infinite;transition:transform .15s}
.nlp-promo:hover .btn{transform:translateY(-2px) scale(1.03)}
.nlp-promo.is-sticky{position:fixed;left:0;right:0;bottom:0;z-index:9998;border-bottom:0}
.nlp-promo.is-hidden{display:none!important}
@keyframes nlpPromoGlow{0%,100%{box-shadow:0 0 10px rgba(201,160,48,.35),inset 0 0 0 rgba(201,160,48,0)}50%{box-shadow:0 0 28px rgba(232,203,122,.75),inset 0 0 18px rgba(201,160,48,.18)}}
@keyframes nlpPromoBtn{0%,100%{box-shadow:0 0 8px rgba(232,203,122,.45)}50%{box-shadow:0 0 22px rgba(232,203,122,.95),0 0 40px rgba(201,160,48,.45)}}
@keyframes nlpPromoShine{0%{left:-40%}55%,100%{left:120%}}
@media (prefers-reduced-motion:reduce){.nlp-promo,.nlp-promo .btn,.nlp-promo:before{animation:none}}
@media (max-width:600px){.nlp-promo .in{gap:10px;padding:12px 14px}.nlp-promo .txt{font-size:13.5px}.nlp-promo .btn{width:100%;text-align:center;font-size:14px;padding:12px 16px}}
</style>

<a class="nlp-promo" href="https://www.nextleagueprogram.com/eb1a2027" data-nlp-promo>
  <div class="in">
    <div class="txt"><span class="g" data-month>November</span> offer: <span class="g">$14,500 + 8 months</span> &middot; ends <span class="g" data-end>Nov 30</span> &middot; <span class="clock" data-clock></span></div>
    <span class="btn">Learn More Here</span>
  </div>
</a>

<script>
(function(){
  /* ===== SETTINGS: edit these lines only ===== */
  var NLP_OFFER_MONTH = 'november';   // after Nov 30 change to 'december'
  var NLP_STICKY = false;             // true = banner sticks to the bottom of the screen
  /* =========================================== */
  var CFG = {
    november: { month:'November', end:'Nov 30', deadline:'2026-11-30T23:59:59-08:00' },
    december: { month:'December', end:'Dec 31', deadline:'2026-12-31T23:59:59-08:00' }
  };
  var c = CFG[NLP_OFFER_MONTH] || CFG.november, END = new Date(c.deadline).getTime();
  var all = document.querySelectorAll('[data-nlp-promo]');
  for (var i=0;i<all.length;i++){ (function(el){
    if (el.getAttribute('data-init')) return; el.setAttribute('data-init','1');
    el.querySelector('[data-month]').textContent = c.month;
    el.querySelector('[data-end]').textContent = c.end;
    if (NLP_STICKY){ el.classList.add('is-sticky'); document.body.style.paddingBottom = (el.offsetHeight||64)+'px'; }
    var clock = el.querySelector('[data-clock]'), iv;
    function pad(n){return n<10?'0'+n:''+n}
    function tick(){
      var t = END - Date.now();
      if (t <= 0){ el.classList.add('is-hidden'); if (NLP_STICKY) document.body.style.paddingBottom=''; clearInterval(iv); return; }
      var d=Math.floor(t/864e5), h=Math.floor(t%864e5/36e5), m=Math.floor(t%36e5/6e4), s=Math.floor(t%6e4/1e3);
      clock.textContent = d+'d '+pad(h)+'h '+pad(m)+'m '+pad(s)+'s left';
    }
    tick(); iv = setInterval(tick,1000);
  })(all[i]); }
})();
</script>
